<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENI BET - Parieur Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCYvaz2Twkwe-X6TlmYbu4LjuSthC7ulLg",
  authDomain: "beni-bet.firebaseapp.com",
  projectId: "beni-bet",
  storageBucket: "beni-bet.firebasestorage.app",
  messagingSenderId: "961834222775",
  appId: "1:961834222775:web:9526702487503a2ebbb932",
  measurementId: "G-DXMDHLDTCH"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = async () => {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    alert("Compte créé ! Bienvenue sur BENI BET");
    location.href = "#dashboard";
  } catch(e){ alert(e.message); }
}
window.login = async () => {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    alert("Connexion réussie !");
    location.href = "#dashboard";
  } catch(e){ alert(e.message); }
}
</script>
</head>
<body class="bg-gray-900 text-white">
<!-- COLLE ICI LE RESTE DE TON DESIGN BENI BET, et change juste les boutons -->
<div class="p-6 max-w-md mx-auto mt-20 bg-gray-800 rounded-xl">
  <h1 class="text-3xl font-bold text-yellow-400 text-center mb-6">BENI BET</h1>
  <input id="email" type="email" placeholder="Email" class="w-full p-3 mb-3 rounded bg-gray-700">
  <input id="pass" type="password" placeholder="Mot de passe" class="w-full p-3 mb-4 rounded bg-gray-700">
  <button onclick="register()" class="w-full bg-yellow-500 text-black font-bold p-3 rounded mb-2">S'inscrire</button>
  <button onclick="login()" class="w-full bg-white text-black font-bold p-3 rounded">Se connecter</button>
  <p class="text-xs text-center mt-4 text-gray-400">Projet: beni-bet connecté à Firebase ✅</p>
</div>
</body>
</html>
