<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BENI BET - Officiel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#eef2f7}
.top{background:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #ddd}
.logo{font-weight:900;color:#0f9d58;font-size:20px}
.logo span{color:#111}
.nav3{display:flex;gap:8px;padding:10px;background:#fff}
.nav3 div{flex:1;text-align:center;padding:8px;border-radius:20px;border:1px solid #ddd;font-size:13px;cursor:pointer}
.nav3 div.active{background:#0f9d58;color:#fff;border-color:#0f9d58}
.sports{display:flex;gap:8px;padding:8px;background:#fff;overflow:auto;border-bottom:1px solid #eee}
.sports span{white-space:nowrap;padding:6px 12px;background:#f1f5f9;border-radius:20px;font-size:12px;cursor:pointer}
.sports span.active{background:#0f9d58;color:#fff}
h3{padding:12px 12px 6px;font-size:13px;display:flex;justify-content:space-between}
.card{background:#fff;margin:0 10px 10px;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center}
.small{color:#64748b;font-size:11px}
.score{font-weight:900;text-align:right}
.live{color:#ef4444;font-size:10px;font-weight:bold}
.cotes{display:flex;gap:6px;margin-top:10px}
.cote{flex:1;background:#f8fafc;border:1px solid #e2e8f0;text-align:center;padding:9px 0;border-radius:8px;font-size:12px;font-weight:bold}
.cote:active{background:#0f9d58;color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 10px;border-top:1px solid #ddd;z-index:15}
.bottom a{font-size:11px;text-align:center;text-decoration:none;color:#64748b;flex:1}
.bottom a.active{color:#0f9d58;font-weight:bold}
.coupon{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#0f9d58;color:#fff;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:16}
.page{display:none;position:fixed;inset:0;background:#eef2f7;z-index:30;overflow:auto;padding-bottom:80px}
.page.active{display:block}
.header-page{background:#fff;padding:12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd;position:sticky;top:0}
.btn-back{border:0;background:#f1f5f9;padding:7px 12px;border-radius:8px;cursor:pointer}
.tabs{display:flex;gap:8px;padding:10px;background:#fff;overflow:auto;border-bottom:1px solid #eee;position:sticky;top:49px}
.tabs span{white-space:nowrap;padding:7px 14px;background:#f1f5f9;border-radius:20px;font-size:12px;cursor:pointer}
.tabs span.active{background:#0f9d58;color:#fff}
.market{background:#fff;margin:10px;border-radius:12px;padding:10px}
.market h4{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.menu-head{background:#0f9d58;color:#fff;padding:24px;text-align:center}
.menu-list a{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid #eee;background:#fff;text-decoration:none;color:#111;font-size:14px}
</style>
</head>
