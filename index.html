<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BENI BET - Clone Officiel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff}
.top{background:#1a2a4a;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:#facc15;font-weight:900;font-size:22px}
.logo span{color:#fff}
.btn-jaune{background:#facc15;color:#000;padding:8px 16px;border-radius:20px;font-weight:bold;text-decoration:none;font-size:13px}
.menu{display:flex;gap:8px;padding:10px;background:#162032;overflow-x:auto;white-space:nowrap}
.menu a{background:#1e293b;color:#94a3b8;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:13px}
.menu a.active{background:#facc15;color:#000;font-weight:bold}
.card{background:#1e293b;margin:12px;border-radius:12px;overflow:hidden;border:1px solid #2a3a5a}
.card-head{background:#243350;padding:10px 14px;font-weight:bold;display:flex;justify-content:space-between;font-size:13px}
.match{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #2a3a5a}
.match:last-child{border:0}
.teams{font-size:13px;line-height:18px}
.teams small{color:#94a3b8}
.cotes{display:flex;gap:6px}
.cote{background:#0f172a;border:1px solid #334155;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer}
.cote:hover{background:#facc15;color:#000}
.bonus-box{background:linear-gradient(135deg,#facc15,#f59e0b);color:#000;text-align:center;padding:18px;border-radius:12px;margin:12px}
.bonus-box h1{font-size:36px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#162032;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #2a3a5a}
.bottom a{color:#94a3b8;text-decoration:none;font-size:11px;text-align:center}
.bottom a.active{color:#facc15}
.live{color:#ef4444;font-size:10px;font-weight:bold;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</
