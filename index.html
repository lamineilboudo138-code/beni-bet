<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BENI BET</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}html,body{overflow-y:auto}body{background:#08080f;color:#fff;padding:10px;padding-bottom:90px}.top{display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:0 auto 10px}.top button{background:#ffcc00;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:bold}.box{max-width:420px;margin:0 auto;background:#161625;border:1px solid #ffcc00;border-radius:18px;padding:16px}.match{background:#24243a;border-radius:12px;padding:12px;margin:10px 0}.cotes{display:flex;gap:6px;margin-top:8px}.cotes button{flex:1;padding:10px;background:#333;color:#fff;border:1px solid #555;border-radius:8px;font-weight:bold}.cotes button.sel{background:#ffcc00;color:#000}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:10px;font-size:15px}.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.modal.open{display:flex}.card{background:#1e1e35;border:1px solid #ffcc00;border-radius:16px;padding:20px;width:100%;max-width:360px;text-align:center}</style></head><body>

<div class="top"><b style="color:#ffcc00;font-size:20px">BENI BET</b><div><button onclick="openCompte()">👤 Compte</button></div></div>

<div class="box"><div style="background:#000;border-radius:12px;padding:12px;text-align:center"><div>Solde</div><b style="color:#ffcc00;font-size:32px" id="soldeA">100 000 F</b><div style="font-size:12px;color:#aaa" id="telA">07664542 - LAMINE</div></div>

<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="background:#00c853;color:#fff;margin:0;flex:1" onclick="openDepot()">💰 Dépôt</button><button class="btn" style="background:#ff6d00;color:#fff;margin:0;flex:1" onclick="openRetrait()">💸 Retrait</button></div>

<h3 style="margin:16px 0 6px">⚽ Matchs du Jour</h3><div id="matchs"><p style="text-align:center;color:#ffcc00">Chargement... ⏳</p></div>

<input id="mise" type="number" placeholder="Mise ex: 5000" style="width:100%;padding:14px;border-radius:10px;border:none;background:#000;color:#fff;text-align:center;margin:12px 0"><button class="btn" style="background:#ffcc00;color:#000" onclick="parier()">Valider mon pari</button><p id="msg" style="margin-top:10px;color:#ffcc00;text-align:center;font-size:13px"></p></div>

<!-- MODAL COMPTE -->
<div id="modalCompte" class="modal" onclick="closeAll()"><div class="card" onclick="event.stopPropagation()"><h2 style="color:#ffcc00">Mon Compte</h2><p style="margin:12px 0">Tel: <b>07664542</b><br>Nom: LAMINE<br>Solde: <b id="soldeB" style="color:#00e676">100 000 F</b></p><button class="btn" style="background:#00c853;color:#fff" onclick="openDepot();closeAll()">Faire un dépôt</button><button class="btn" style="background:#333;color:#fff" onclick="closeAll()">Fermer</button></div></div>

<!-- MODAL DEPOT -->
<div id="modalDepot" class="modal" onclick="closeAll()"><div class="card" onclick="event.stopPropagation()"><h2 style="color:#00e676">Dépôt Orange / Moov</h2><p style="font-size:13px;margin:10px 0;color:#ccc">1. Envoie l'argent sur ce numéro<br>2. Clique sur confirmer</p><div style="background:#000;padding:12px;border-radius:10px;margin:10px 0"><b style="font-size:22px;color:#ffcc00">07 66 45 42</b><br><span style="font-size:12px">Nom: LAMINE ILBOUDO</span></div><input id="montantDepot" type="number" placeholder="Montant envoyé ex: 10000" style="width:100%;padding:12px;border-radius:8px;border:none;background:#333;color:#fff;text-align:center"><button class="btn" style="background:#00c853;color:#fff" onclick="confirmerDepot()">J'ai envoyé ✅</button><button class="btn" style="background:#333;color:#fff" onclick="closeAll()">Annuler</button></div></div>

<!-- MODAL RETRAIT -->
<div id="modalRetrait" class="modal" onclick="closeAll()"><div class="card" onclick="event.stopPropagation()"><h2 style="color:#ff6d00">Retrait</h2><input id="montantRetrait" type="number" placeholder="Montant ex: 5000" style="width:100%;padding:12px;border-radius:8px;border:none;background:#333;color:#fff;text-align:center;margin-top:10px"><button class="btn" style="background:#ff6d00;color:#fff" onclick="confirmerRetrait()">Demander retrait</button><button class="btn" style="background:#333;color:#fff" onclick="closeAll()">Annuler</button></div></div>

<script>
let solde=100000,choix="",matchChoisi="";
function openCompte(){document.getElementById('modalCompte').classList.add('open')}function openDepot(){document.getElementById('modalDepot').classList.add('open')}function openRetrait(){document.getElementById('modalRetrait').classList.add('open')}function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'))}
function updateSolde(){document.getElementById('soldeA').innerText=solde.toLocaleString()+' F';document.getElementById('soldeB').innerText=solde.toLocaleString()+' F'}
async function loadMatchs(){try{let r=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard');let d=await r.json();let html="";let games=d.events||[];if(games.length==0)throw"vide";games.slice(0,4).forEach(ev=>{let h=ev.competitions[0].competitors[0].team.displayName;let a=ev.competitions[0].competitors[1].team.displayName;let heure=new Date(ev.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});html+=`<div class="match"><b>${h} vs ${a} - ${heure}</b><div class="cotes"><button onclick="sel(this,'${h}','${h} vs ${a}')">${h.split(' ').pop()} 2.10</button><button onclick="sel(this,'Nul','${h} vs ${a}')">Nul 3.20</button><button onclick="sel(this,'${a}','${h} vs ${a}')">${a.split(' ').pop()} 2.85</button></div></div>`});document.getElementById('matchs').innerHTML=html}catch(e){document.getElementById('matchs').innerHTML=`<div class="match"><b>Man City vs Liverpool - 17h30</b><div class="cotes"><button onclick="sel(this,'City','City vs Liv')">City 1.95</button><button onclick="sel(this,'Nul','City vs Liv')">Nul 3.30</button><button onclick="sel(this,'Liverpool','City vs Liv')">Liv 2.75</button></div></div><div class="match"><b>Real vs Atletico - 21h</b><div class="cotes"><button onclick="sel(this,'Real','Real vs Atleti')">Real 2.15</button><button onclick="sel(this,'Nul','Real vs Atleti')">Nul 3.10</button><button onclick="sel(this,'Atleti','Real vs Atleti')">Atleti 3.00</button></div></div>`}}
function sel(b,c,m){document.querySelectorAll('.cotes button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');choix=c;matchChoisi=m;document.getElementById('msg').innerText="✅ "+m+" -> "+c}
function confirmerDepot(){let mt=parseInt(document.getElementById('montantDepot').value);if(!mt)return alert('Entre montant');let txt=`NOUVEAU DEPOT BENI BET%0AMontant: ${mt}F%0AClient: 07664542 LAMINE%0AJe viens d envoyer sur 07 66 45 42`;window.open('https://wa.me/22607664542?text='+txt,'_blank');closeAll()}
function confirmerRetrait(){let mt=parseInt(document.getElementById('montantRetrait').value);if(!mt||mt>solde)return alert('Montant invalide');let txt=`DEMANDE RETRAIT%0AMontant: ${mt}F%0AClient: 07664542 LAMINE%0ASolde: ${solde}F`;window.open('https://wa.me/22607664542?text='+txt,'_blank');closeAll()}
function parier(){let mv=parseInt(document.getElementById('mise').value);if(!choix)return alert('Choisis une cote');if(!mv||mv>solde)return alert('Mise invalide');solde-=mv;updateSolde();let t=`PARI BENI BET%0AMatch: ${matchChoisi}%0APari: ${choix}%0AMise: ${mv}F`;window.open('https://wa.me/22607664542?text='+t,'_blank')}
loadMatchs();
</script></body></html>
