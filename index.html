<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BENI BET - Vrais Matchs</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}html,body{height:auto;overflow-y:auto}body{background:#08080f;color:#fff;padding:10px;padding-bottom:80px}.box{max-width:420px;margin:10px auto;background:#161625;border:1px solid #ffcc00;border-radius:18px;padding:16px}.match{background:#24243a;border-radius:12px;padding:12px;margin:10px 0}.cotes{display:flex;gap:6px;margin-top:8px}.cotes button{flex:1;padding:10px;background:#333;color:#fff;border:1px solid #555;border-radius:8px;font-weight:bold}.cotes button.sel{background:#ffcc00;color:#000}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:10px}</style></head><body><div class="box"><h1 style="color:#ffcc00;text-align:center">BENI BET</h1><p style="color:#00e676;text-align:center;font-size:12px" id="date"></p><p style="color:#aaa;text-align:center;font-size:11px">ADMIN - LAMINE 07664542</p><div style="background:#000;border-radius:12px;padding:12px;margin:12px 0;text-align:center"><div>Solde Démo</div><b style="color:#ffcc00;font-size:28px" id="soldeA">100 000 F</b></div><div id="matchs"><p style="text-align:center;color:#ffcc00">Chargement des vrais matchs du jour... ⏳</p></div><input id="mise" type="number" placeholder="Mise ex: 5000" style="width:100%;padding:14px;border-radius:10px;border:none;background:#000;color:#fff;text-align:center;margin:10px 0"><button class="btn" style="background:#00c853;color:#fff" onclick="parier()">Valider mon pari sur WhatsApp</button><button class="btn" style="background:#ff6d00;color:#fff" onclick="retrait()">💸 Retrait Orange / Moov</button><p id="msg" style="margin-top:10px;color:#ffcc00;text-align:center;font-size:13px"></p></div><script>
let solde=100000,choix="",matchChoisi="";
document.getElementById('date').innerText = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
async function loadMatchs(){
 try{
  // API GRATUITE ESPN - Vrais matchs du jour
  let r = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates='+new Date().toISOString().slice(0,10).replace(/-/g,''));
  let d = await r.json();
  let html="";
  let games = d.events || [];
  // Si pas de match Premier League aujourd'hui, on prend La Liga + fallback
  if(games.length==0){
    let r2 = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard');
    let d2 = await r2.json(); games = d2.events || [];
  }
  if(games.length==0){ throw "vide"; }
  games.slice(0,5).forEach(ev=>{
    let home=ev.competitions[0].competitors[0].team.displayName;
    let away=ev.competitions[0].competitors[1].team.displayName;
    let heure = new Date(ev.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    html+=`<div class="match"><b>${home} vs ${away} - ${heure}</b><div class="cotes"><button onclick="sel(this,'${home} Vainqueur','${home} vs ${away}')">${home.split(' ').pop()} 2.10</button><button onclick="sel(this,'Match Nul','${home} vs ${away}')">Nul 3.20</button><button onclick="sel(this,'${away} Vainqueur','${home} vs ${away}')">${away.split(' ').pop()} 2.85</button></div></div>`;
  });
  document.getElementById('matchs').innerHTML=html;
 }catch(e){
  // Fallback si API en panne : 3 vrais matchs de la semaine
  document.getElementById('matchs').innerHTML=`<div class="match"><b>Man City vs Liverpool - 17h30</b><div class="cotes"><button onclick="sel(this,'City','Man City vs Liverpool')">City 1.95</button><button onclick="sel(this,'Nul','Man City vs Liverpool')">Nul 3.30</button><button onclick="sel(this,'Liverpool','Man City vs Liverpool')">Liv 2.75</button></div></div><div class="match"><b>Real Madrid vs Atletico - 21h00</b><div class="cotes"><button onclick="sel(this,'Real','Real vs Atletico')">Real 2.15</button><button onclick="sel(this,'Nul','Real vs Atletico')">Nul 3.10</button><button onclick="sel(this,'Atletico','Real vs Atletico')">Atleti 3.00</button></div></div><div class="match"><b>PSG vs Marseille - 20h45</b><div class="cotes"><button onclick="sel(this,'PSG','PSG vs Marseille')">PSG 1.85</button><button onclick="sel(this,'Nul','PSG vs Marseille')">Nul 3.40</button><button onclick="sel(this,'Marseille','PSG vs Marseille')">OM 4.10</button></div></div>`;
 }
}
function sel(btn, c, m){ document.querySelectorAll('.cotes button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); choix=c; matchChoisi=m; document.getElementById('msg').innerText="✅ Choisi: "+m+" -> "+c; }
function parier(){let miseV=parseInt(document.getElementById('mise').value);if(!choix)return alert('Choisis une cote d abord');if(!miseV||miseV>solde)return alert('Mise invalide (max '+solde+'F)');solde-=miseV;document.getElementById('soldeA').innerText=solde.toLocaleString()+' F';let t=`NOUVEAU PARI BENI BET%0AClient: LAMINE%0AMatch: ${matchChoisi}%0APari: ${choix}%0AMise: ${miseV}F%0ASolde restant: ${solde}F%0ATel: 07664542`;window.open('https://wa.me/22607664542?text='+t,'_blank')}
function retrait(){let m=prompt('Montant retrait?');if(!m)return;let t=`DEMANDE RETRAIT BENI BET%0AMontant: ${m}F%0ATel: 07664542%0ANom: LAMINE`;window.open('https://wa.me/22607664542?text='+t,'_blank')}
loadMatchs();
</script></body></html>
