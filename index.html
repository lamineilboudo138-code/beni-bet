<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BENI BET V7 LIVE</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#08080f;color:#fff;padding-bottom:90px}.top{display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:10px auto;background:#161625;padding:12px 14px;border-radius:12px;border:1px solid #333}.box{max-width:420px;margin:0 auto;background:#161625;border:1px solid #ffcc00;border-radius:18px;padding:12px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;background:#2a2a45;color:#aaa}.tabs button.act{background:#ffcc00;color:#000}.match{background:#24243a;border-radius:12px;padding:12px;margin:10px 0;border-left:3px solid #333}.match.live{border-left-color:#ff1744}.cotes{display:flex;gap:6px;margin-top:8px}.cotes button{flex:1;padding:10px;background:#333;color:#fff;border:1px solid #555;border-radius:8px;font-weight:bold}.cotes button.sel{background:#ffcc00;color:#000}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:10px}.badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:bold}.live-dot{width:8px;height:8px;background:#ff1744;border-radius:50%;display:inline-block;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);display:none;z-index:99}.modal.open{display:block}.menu{max-width:420px;margin:0 auto;background:#101022;min-height:100vh;padding:16px}</style></head><body>
<div class="top"><b style="color:#ffcc00;font-size:20px">BENI BET</b><div><button onclick="openMenu()" style="font-size:22px;background:none;border:none;color:#fff">☰</button></div></div>
<div class="box">
<div style="background:#000;border-radius:12px;padding:12px;text-align:center"><b style="color:#ffcc00;font-size:28px">100 000 F</b><div style="font-size:11px;color:#aaa">07664542 - LAMINE</div></div>
<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="background:#00c853;color:#fff;margin:0;flex:1" onclick="openDepot()">💰 Dépôt</button><button class="btn" style="background:#ff6d00;color:#fff;margin:0;flex:1" onclick="openRetrait()">💸 Retrait</button></div>

<div class="tabs"><button id="btnLive" onclick="showTab('live')">🔴 En Direct (<span id="cLive">0</span>)</button><button id="btnPrematch" class="act" onclick="showTab('pre')">🕒 Avant-Match (<span id="cPre">0</span>)</button></div>

<div id="matchsLive" style="display:none"></div><div id="matchsPre"><p style="text-align:center;color:#ffcc00">Chargement des vrais matchs... ⏳</p></div>

<input id="mise" type="number" placeholder="Mise ex: 5000" style="width:100%;padding:14px;border-radius:10px;border:none;background:#000;color:#fff;text-align:center;margin:12px 0"><button class="btn" style="background:#ffcc00;color:#000" onclick="parier()">Valider mon pari</button><p id="msg" style="text-align:center;color:#ffcc00;margin-top:8px;font-size:13px"></p>
</div>

<div id="modalMenu" class="modal"><div class="menu"><div style="display:flex;justify-content:space-between"><h2 style="color:#ffcc00">MENU</h2><button onclick="closeAll()" style="background:none;border:none;color:#fff;font-size:24px">✕</button></div><div style="margin-top:20px"><a style="display:block;padding:16px;background:#1e1e35;margin:8px 0;border-radius:10px;color:#fff;text-decoration:none" onclick="showTab('live');closeAll()">🔴 Football En Direct</a><a style="display:block;padding:16px;background:#1e1e35;margin:8px 0;border-radius:10px;color:#fff;text-decoration:none" onclick="showTab('pre');closeAll()">🕒 Football Avant-Match</a><a style="display:block;padding:16px;background:#1e1e35;margin:8px 0;border-radius:10px;color:#fff;text-decoration:none" onclick="openDepot()">💰 Dépôt Orange / Moov</a><a style="display:block;padding:16px;background:#1e1e35;margin:8px 0;border-radius:10px;color:#fff;text-decoration:none" onclick="openRetrait()">💸 Retrait</a></div></div></div>
<div id="modalDepot" class="modal"><div class="menu"><h2 style="color:#00e676;text-align:center;margin-top:20px">Dépôt</h2><div style="background:#000;padding:16px;border-radius:12px;text-align:center;margin:20px 0"><b style="font-size:24px;color:#ffcc00">07 66 45 42</b><br>LAMINE ILBOUDO</div><input id="mDepot" type="number" placeholder="Montant" style="width:100%;padding:14px;border-radius:10px;background:#222;border:none;color:#fff;text-align:center"><button class="btn" style="background:#00c853;color:#fff" onclick="confDepot()">J'ai envoyé ✅</button><button class="btn" style="background:#333" onclick="closeAll()">Fermer</button></div></div>
<div id="modalRetrait" class="modal"><div class="menu"><h2 style="color:#ff6d00;text-align:center;margin-top:20px">Retrait</h2><input id="mRetrait" type="number" placeholder="Montant 5000" style="width:100%;padding:14px;border-radius:10px;background:#222;border:none;color:#fff;text-align:center;margin:20px 0"><button class="btn" style="background:#ff6d00;color:#fff" onclick="confRetrait()">Demander retrait</button><button class="btn" style="background:#333" onclick="closeAll()">Fermer</button></div></div>

<script>
let choix="",matchChoisi="",tab="pre";
function showTab(t){tab=t;document.getElementById('btnLive').classList.toggle('act',t=='live');document.getElementById('btnPrematch').classList.toggle('act',t=='pre');document.getElementById('matchsLive').style.display=t=='live'?'block':'none';document.getElementById('matchsPre').style.display=t=='pre'?'block':'none'}
function openMenu(){document.getElementById('modalMenu').classList.add('open')}function openDepot(){document.getElementById('modalDepot').classList.add('open')}function openRetrait(){document.getElementById('modalRetrait').classList.add('open')}function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'))}
async function load(){
 let liveHtml="",preHtml="",cL=0,cP=0;
 try{
  let urls=['https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard','https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard','https://site.api.espn.com/apis/site/v2/sports/soccer/fra.1/scoreboard'];
  for(let url of urls){
   let r=await fetch(url); let d=await r.json();
   (d.events||[]).forEach(ev=>{
    let comp=ev.competitions[0]; let h=comp.competitors[0].team.displayName; let a=comp.competitors[1].team.displayName; let status=comp.status.type.state; let score=(comp.competitors[0].score||0)+'-'+(comp.competitors[1].score||0); let time=comp.status.displayClock||comp.status.type.shortDetail; let isLive=status=='in';
    let card=`<div class="match ${isLive?'live':''}"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${isLive?'<span class=live-dot></span> LIVE <span class=badge style=background:#ff1744;color:#fff>'+score+'</span> '+time:'<span class=badge style=background:#333;color:#ffcc00>🕒 '+new Date(ev.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</span>'}</span><span style="color:#aaa">${ev.league||''}</span></div><b style="display:block;margin:6px 0">${h} vs ${a}</b><div class="cotes"><button onclick="sel(this,'${h} Vainqueur','${h} vs ${a} ${isLive?'(LIVE)':''}')">${h.split(' ').pop()} ${isLive?'2.45':'2.10'}</button><button onclick="sel(this,'Nul','${h} vs ${a}')">Nul 3.20</button><button onclick="sel(this,'${a} Vainqueur','${h} vs ${a}')"> ${a.split(' ').pop()} ${isLive?'2.95':'2.85'}</button></div></div>`;
    if(isLive){liveHtml+=card;cL++;} else {preHtml+=card;cP++;}
   });
  }
 }catch(e){}
 if(cL==0) liveHtml='<p style="text-align:center;color:#aaa;padding:20px">Aucun match en direct maintenant.<br>Reviens à 19h, il y aura des matchs LIVE 🔴</p>';
 if(cP==0) preHtml=`<div class="match"><b>Arsenal vs Coventry - 19:00</b><div class="cotes"><button onclick="sel(this,'Arsenal','Arsenal vs Coventry')">Arsenal 2.10</button><button onclick="sel(this,'Nul','Arsenal vs Coventry')">Nul 3.20</button><button onclick="sel(this,'Coventry','Arsenal vs Coventry')">City 2.85</button></div></div>`;
 document.getElementById('matchsLive').innerHTML=liveHtml; document.getElementById('matchsPre').innerHTML=preHtml;
 document.getElementById('cLive').innerText=cL; document.getElementById('cPre').innerText=cP;
}
function sel(b,c,m){document.querySelectorAll('.cotes button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');choix=c;matchChoisi=m;document.getElementById('msg').innerText="✅ "+m+" -> "+c}
function confDepot(){let v=document.getElementById('mDepot').value;window.open('https://wa.me/22607664542?text=DEPOT '+v+'F','_blank')}function confRetrait(){let v=document.getElementById('mRetrait').value;window.open('https://wa.me/22607664542?text=RETRAIT '+v+'F - 07664542 LAMINE','_blank')}function parier(){let mise=document.getElementById('mise').value;if(!choix)return alert('Choisis une cote');window.open('https://wa.me/22607664542?text=PARI '+mise+'F sur '+choix+' - '+matchChoisi,'_blank')}
load(); setInterval(load,60000);
</script></body></html>
